<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Smart To-Do List</h1>
        <p>Organize your tasks and stay productive.</p>
    </header>
    <main>
        <form>
            <label for="task">Enter your task: </label>
            <input type="text" id="task">

            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                <option value="low">low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate">

            <button id="addTask">Add Task</button>

        </form> 

        <label for="search">Search Tasks</label>
        <input type="search" id="search" placeholder="Search your tasks...">

        <div class="filters">
            <button type="button" id="allTasks">All</button>
            <button type="button" id="activeTasks">Active Tasks</button>
            <button type="button" id="completedTasks">Completed Tasks</button>
        </div>

        <div class="task-counter">
            <p>Total: <span id="totalCount">0</span></p>
            <p>Active: <span id="activeCount">0</span></p>
            <p>Completed: <span id="completedCount">0</span></p>
        </div>

        <div class="taskList">
            <ul id="taskList">
            
            </ul>
        </div>

    </main>
</body>
</html>
